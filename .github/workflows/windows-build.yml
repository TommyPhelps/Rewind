name: Windows build

# Builds REWIND on a GitHub-hosted Windows machine and uploads the installers.
# Runs on every push to main, on demand (Actions tab -> Windows build -> Run workflow),
# and on version tags (v2.0.0 etc.), which also publish a GitHub Release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 75
    permissions:
      contents: write # commits generated lockfiles to main and saves logs to the ci-logs branch
    defaults:
      run:
        shell: bash
    env:
      LOGS: ${{ github.workspace }}/ci-logs
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Rust (stable, MSVC)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Tool versions
        run: |
          mkdir -p "$LOGS"
          { node -v; npm -v; rustc -V; cargo -V; } 2>&1 | tee "$LOGS/00-versions.log"

      - name: Install dependencies
        id: install
        run: |
          set -o pipefail
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund 2>&1 | tee "$LOGS/01-npm-install.log"
          else
            echo "No package-lock.json yet: installing fresh. The lockfile is committed back to main at the end of this run."
            npm install --no-audit --no-fund 2>&1 | tee "$LOGS/01-npm-install.log"
          fi

      - name: Unit tests (schema, migration, backups, filters)
        if: always() && steps.install.outcome == 'success'
        run: |
          set -o pipefail
          npm test 2>&1 | tee "$LOGS/02-tests.log"

      - name: Build frontend
        if: always() && steps.install.outcome == 'success'
        run: |
          set -o pipefail
          npm run build 2>&1 | tee "$LOGS/03-frontend.log"

      - name: Add new Rust dependencies to Cargo.lock (existing versions stay pinned)
        if: always() && steps.install.outcome == 'success'
        run: |
          set -o pipefail
          # 'cargo metadata' adds packages that Cargo.toml now needs and leaves every existing pin alone.
          # The build below still runs with --locked, so nothing else can change silently.
          cargo metadata --manifest-path src-tauri/Cargo.toml --format-version 1 > /dev/null 2> "$LOGS/03b-cargo-lock.log" || { cat "$LOGS/03b-cargo-lock.log"; exit 1; }
          git diff --stat -- src-tauri/Cargo.lock | tee -a "$LOGS/03b-cargo-lock.log"

      - name: Build Windows app + NSIS installer
        id: nsis
        if: always() && steps.install.outcome == 'success'
        run: |
          set -o pipefail
          LOCKED=""; [ -f src-tauri/Cargo.lock ] && LOCKED="-- --locked"
          npx tauri build --bundles nsis $LOCKED 2>&1 | tee "$LOGS/04-tauri-nsis.log"

      - name: Collect NSIS installer + portable exe
        id: collect
        if: always() && steps.nsis.outcome == 'success'
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          mkdir -p out
          cp src-tauri/target/release/bundle/nsis/*.exe out/
          cp src-tauri/target/release/rewind.exe "out/REWIND_${VERSION}_x64_portable.exe"
          ls -la out | tee "$LOGS/05-outputs.log"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build MSI installer
        if: always() && steps.collect.outcome == 'success'
        run: |
          set -o pipefail
          LOCKED=""; [ -f src-tauri/Cargo.lock ] && LOCKED="-- --locked"
          npx tauri build --bundles msi $LOCKED 2>&1 | tee "$LOGS/06-tauri-msi.log"
          cp src-tauri/target/release/bundle/msi/*.msi out/

      - name: Checksums
        if: always() && steps.collect.outcome == 'success'
        run: |
          cd out && sha256sum * | grep -v SHA256SUMS > SHA256SUMS.txt; cat SHA256SUMS.txt | tee -a "$LOGS/05-outputs.log"

      # Uploads whatever was built, even if a later step (like the MSI) failed.
      - name: Upload installers
        if: always() && steps.collect.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: REWIND-${{ steps.collect.outputs.version }}-windows-x64
          path: out/*
          if-no-files-found: error
          retention-days: 30

      - name: Type check
        if: always() && steps.install.outcome == 'success'
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee "$LOGS/07-typecheck.log"

      # Preserves the lockfiles from the first successful install so every later
      # build uses exactly the same dependency versions.
      - name: Commit lockfiles
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "rewind-ci"
          git config user.email "rewind-ci@users.noreply.github.com"
          git add package-lock.json src-tauri/Cargo.lock 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Lockfiles already committed."
          else
            git commit -m "Add lockfiles generated by CI [skip ci]"
            git push origin HEAD:main || echo "::warning::Could not push lockfiles (main moved on); they are in the 'lockfiles' artifact."
          fi

      - name: Upload lockfiles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lockfiles
          path: |
            package-lock.json
            src-tauri/Cargo.lock
          if-no-files-found: ignore

      # Full plain-text logs on a separate 'ci-logs' branch so a failed build can be
      # diagnosed from the repository itself. Safe to delete; it never triggers builds.
      - name: Save logs to ci-logs branch
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
        run: |
          mkdir -p "$LOGS"
          echo "run=${GITHUB_RUN_NUMBER} attempt=${GITHUB_RUN_ATTEMPT} sha=${GITHUB_SHA} status=${JOB_STATUS}" > "$LOGS/RUN.txt"
          cd "$RUNNER_TEMP" && rm -rf logrepo && mkdir logrepo && cd logrepo
          git init -q && cp "$LOGS"/* .
          git -c user.name=rewind-ci -c user.email=rewind-ci@users.noreply.github.com add .
          git -c user.name=rewind-ci -c user.email=rewind-ci@users.noreply.github.com commit -qm "CI logs: run ${GITHUB_RUN_NUMBER} (${JOB_STATUS})"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/ci-logs || echo "::warning::could not save logs branch"

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: REWIND-*-windows-x64
          path: dist
          merge-multiple: true
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
